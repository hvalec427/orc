[package]
name = "orc"
version = "0.1.0"
edition = "2021"
description = "Orchestrate many claude CLI agents in parallel from a ratatui TUI"

[[bin]]
name = "orc"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
dirs = "7"
uuid = { version = "1", features = ["v4"] }
notify = "8"
regex = "1"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
